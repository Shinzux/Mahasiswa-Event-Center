<!doctype html>
<!-- Halaman Event | PIC: Bintang P. S. -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event | Event Mahasiswa Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>

    <!-- NAVBAR: dimuat otomatis dari template/navbar.html -->
    <div id="navbar-placeholder"></div>

    <main>

      <!-- BANNER: warna & tinggi diatur di style.css bagian .banner -->
      <div class="banner" role="img" aria-label="Banner Event"></div>

      <!-- KARTU JUDUL
           Ubah judul  → edit <h1>
           Ubah subjudul → edit <p> -->
      <section class="kolom-sempit" aria-labelledby="judulHalaman">
        <div class="kartu-judul">
          <h1 id="judulHalaman">Jelajahi Event Mahasiswa</h1>
          <p class="mt-4 mb-0 small">
            Temukan seminar, workshop, kompetisi, dan kegiatan organisasi
            mahasiswa dalam satu tempat.
          </p>
        </div>
      </section>

      <!-- DAFTAR EVENT
           Kartu-kartu di bawah dibuat otomatis oleh JavaScript.
           Untuk menambah/ubah data event → buka assets/js/script.js
           Untuk ubah jumlah event per halaman → cari PER_HALAMAN di <script> -->
      <section class="py-5 bg-soft" aria-label="Daftar event">
        <div class="container" style="max-width: 980px">

          <div class="daftar-event" id="daftarEvent"></div>

          <p class="small teks-sekunder mt-4 mb-0 text-center">
            Pertanyaan tentang syarat, biaya, atau pendaftaran sebaiknya
            ditujukan ke penyelenggara masing-masing event.
          </p>

        </div>
      </section>

    </main>

    <!-- FOOTER: dimuat otomatis dari template/footer.html -->
    <div id="footer-placeholder"></div>

    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Muat data event SEBELUM script di bawah -->
    <script src="assets/js/script.js"></script>

    <script>
      var hariIni = new Date().setHours(0, 0, 0, 0);

      // Buat tampilan satu kartu event.
      // Ubah bagian HTML di sini jika ingin ganti tampilan kartu.
      function buatKartu(e) {

        // Tentukan apakah event sudah Selesai atau Akan Datang
        var tglAkhir = e.dateEnd || e.date;
        var tglObj   = tglAkhir.length === 7
          ? new Date(+tglAkhir.slice(0, 4), +tglAkhir.slice(5), 0)
          : new Date(tglAkhir + "T00:00:00");
        var status = tglObj < hariIni ? "Selesai" : "Akan Datang";
        var badge  = status === "Selesai" ? "badge-selesai" : "badge-akan-datang";

        // Ubah "2026-11-12" → "12 November 2026"
        function fmt(tgl) {
          var opts = tgl.length === 7
            ? { month: "long", year: "numeric" }
            : { day: "numeric", month: "long", year: "numeric" };
          return new Date((tgl.length === 7 ? tgl + "-01" : tgl) + "T00:00:00")
            .toLocaleDateString("id-ID", opts);
        }
        var tanggal = e.dateEnd ? fmt(e.date) + " – " + fmt(e.dateEnd) : fmt(e.date);

        return `
          <article class="kartu-event">
            <div class="thumb-event">${logoEvent(e)}</div>
            <div class="isi-event">
              <span class="badge ${badge}">${status}</span>
              <h3 class="judul-event">${e.title}</h3>
              <div class="meta-event">
                <span><i class="bi bi-tag"           aria-hidden="true"></i>${e.category}</span>
                <span><i class="bi bi-geo-alt"        aria-hidden="true"></i>${e.location}</span>
                <span><i class="bi bi-calendar-event" aria-hidden="true"></i><strong>${tanggal}</strong></span>
              </div>
            </div>
            <div class="aksi-event">
              <a class="btn btn-maroon rounded-pill px-4"
                 href="detail-event.html?event=${encodeURIComponent(e.id)}"
                 aria-label="Lihat detail ${e.title}">Lihat Detail</a>
            </div>
          </article>`;
      }

      // Tampilkan semua event, diurutkan dari tanggal terdekat
      var daftar = DATA_EVENT.slice().sort(function (a, b) {
        return a.date < b.date ? -1 : 1;
      });
      document.getElementById("daftarEvent").innerHTML = daftar.map(buatKartu).join("");
    </script>

  </body>
</html>
