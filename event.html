<!doctype html>
<!-- Halaman Event | PIC: Bintang P. S. -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event | Event Mahasiswa Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>

    <!-- NAVBAR: dimuat otomatis dari template/navbar.html -->
    <div id="navbar-placeholder"></div>

    <main>

      <!-- BANNER: warna & tinggi diatur di style.css bagian .banner -->
      <div class="banner" role="img" aria-label="Banner Event"></div>

      <!-- KARTU JUDUL
           Ubah judul  → edit <h1>
           Ubah subjudul → edit <p> -->
      <section class="kolom-sempit" aria-labelledby="judulHalaman">
        <div class="kartu-judul">
          <h1 id="judulHalaman">Jelajahi Event Mahasiswa</h1>
          <p class="mt-4 mb-0 small">
            Temukan seminar, workshop, kompetisi, dan kegiatan organisasi
            mahasiswa dalam satu tempat.
          </p>
        </div>
      </section>

      <!-- DAFTAR EVENT
           Kartu-kartu di bawah dibuat otomatis oleh JavaScript.
           Untuk menambah/mengubah data event atau statusnya → buka assets/js/script.js -->
      <section class="py-5 bg-soft" aria-label="Daftar event">
        <div class="container" style="max-width: 980px">

          <div class="daftar-event" id="daftarEvent"></div>

          <p class="small text-secondary mt-4 mb-0 text-center">
            Pertanyaan tentang syarat, biaya, atau pendaftaran sebaiknya
            ditujukan ke penyelenggara masing-masing event.
          </p>

        </div>
      </section>

    </main>

    <!-- FOOTER: dimuat otomatis dari template/footer.html -->
    <div id="footer-placeholder"></div>

    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Muat data event & helper SEBELUM script di bawah -->
    <script src="assets/js/script.js"></script>

    <script>
      // Buat tampilan satu kartu event
      function buatKartu(e) {
        var badge = e.status === "Selesai" ? "badge-selesai" : "badge-akan-datang";
        var tanggal = e.dateEnd
          ? formatTanggal(e.date) + " – " + formatTanggal(e.dateEnd)
          : formatTanggal(e.date);

        return `
          <article class="kartu-event">
            <div class="thumb-event">${logoEvent(e)}</div>
            <div class="isi-event">
              <span class="badge ${badge}">${e.status}</span>
              <h3 class="judul-event">${e.title}</h3>
              <div class="meta-event">
                <span><i class="bi bi-tag"></i>${e.category}</span>
                <span><i class="bi bi-geo-alt"></i>${e.location}</span>
                <span><i class="bi bi-calendar-event"></i><strong>${tanggal}</strong></span>
              </div>
            </div>
            <div class="aksi-event">
              <a class="btn btn-maroon rounded-pill px-4" href="detail-event.html?event=${e.id}">Lihat Detail</a>
            </div>
          </article>`;
      }

      // Tampilkan semua event langsung dari DATA_EVENT
      document.getElementById("daftarEvent").innerHTML = DATA_EVENT.map(buatKartu).join("");
    </script>

  </body>
</html>
