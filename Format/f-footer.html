<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Format Footer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <style>
      /* .brand-icon juga ada di navbar.html. Kalau dobel, tidak masalah. */
      .brand-icon {
        width: 42px;
        height: 42px;
        background-color: #720927;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 4px 10px rgba(114, 9, 39, 0.2);
      }

      footer {
        background-color: #2b0b16;
        color: white;
      }
      footer a {
        color: white;
        text-decoration: none;
      }
      .footer-desc {
        color: rgba(255, 255, 255, 0.75);
        max-width: 42ch;
      }
      .footer-title {
        font-weight: 700;
        margin-bottom: 14px;
        padding-bottom: 8px;
        position: relative;
      }
      .footer-title::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 28px;
        height: 3px;
        border-radius: 2px;
        background: #ff6b8b;
      }
      .footer-links {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .footer-links li {
        margin-bottom: 10px;
      }
      .footer-links a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.75);
        transition:
          color 0.2s,
          transform 0.2s;
      }
      .footer-links a:hover {
        color: #ff6b8b;
        transform: translateX(4px);
      }
      .footer-links i {
        color: #ff6b8b;
      }
      .footer-line {
        margin: 28px 0 16px;
        border-color: rgba(255, 255, 255, 0.2);
        opacity: 1;
      }
      .footer-copy {
        color: rgba(255, 255, 255, 0.6);
      }
      @media (prefers-reduced-motion: reduce) {
        .footer-links a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <footer class="py-4">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-6">
            <h5 class="fw-bold d-flex align-items-center gap-2 mb-3">
              <span
                class="brand-icon"
                style="
                  width: 36px;
                  height: 36px;
                  background-color: #800f2f;
                  border-radius: 10px;
                "
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M4 8.5C4 7.12 5.12 6 6.5 6H17.5C18.88 6 20 7.12 20 8.5V17C20 18.66 18.66 20 17 20H7C5.34 20 4 18.66 4 17V8.5Z"
                    fill="white"
                  />
                  <rect
                    x="7"
                    y="3.5"
                    width="2"
                    height="3.5"
                    rx="1"
                    fill="white"
                  />
                  <rect
                    x="15"
                    y="3.5"
                    width="2"
                    height="3.5"
                    rx="1"
                    fill="white"
                  />
                  <path d="M4 10H20" stroke="#800f2f" stroke-width="1.8" />
                  <rect
                    x="14"
                    y="13.5"
                    width="2.5"
                    height="2.5"
                    rx="0.5"
                    fill="#800f2f"
                  />
                </svg>
              </span>
              <span
                >Event<span style="color: #ff6b8b">Mahasiswa</span> Center</span
              >
            </h5>
            <p class="footer-desc">
              Pusat informasi seminar, workshop, dan kegiatan mahasiswa.
            </p>
          </div>

          <div class="col-6 col-lg-3">
            <h6 class="footer-title">Navigasi</h6>
            <ul class="footer-links">
              <li>
                <a href="beranda.html"
                  ><i class="bi bi-house" aria-hidden="true"></i>Beranda</a
                >
              </li>
              <li>
                <a href="profil.html"
                  ><i class="bi bi-person" aria-hidden="true"></i>Profil</a
                >
              </li>
              <li>
                <a href="event-1.html"
                  ><i class="bi bi-calendar-event" aria-hidden="true"></i
                  >Event</a
                >
              </li>
            </ul>
          </div>

          <div class="col-6 col-lg-3">
            <h6 class="footer-title">Jelajahi</h6>
            <ul class="footer-links">
              <li>
                <a href="gis.html"
                  ><i class="bi bi-geo-alt" aria-hidden="true"></i>Lokasi
                  Event</a
                >
              </li>
            </ul>
          </div>
        </div>

        <hr class="footer-line" />
        <p class="small text-center mb-0 footer-copy">
          &copy; 2026 Event Mahasiswa Center | Proyek UTS Pemrograman Web
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
