<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Event | Event Mahasiswa Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <div id="navbar-placeholder"></div>

    <!-- HEADER -->
    <section class="hero py-5">
      <div class="container">
        <p class="fw-bold mb-2" style="color: #800f2f">INFORMASI KEGIATAN</p>
        <h1 class="fw-bold">Detail Event</h1>
        <p class="text-secondary mb-0">Kenali lebih lengkap kegiatan yang bisa kamu ikuti.</p>
      </div>
    </section>

    <!-- DETAIL EVENT -->
    <section class="container py-5">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <span class="badge bg-danger mb-3" id="detailKategori"></span>
              <h2 class="fw-bold mb-3" id="detailNama"></h2>
              <h5 class="fw-bold mt-4">Deskripsi Kegiatan</h5>
              <p class="text-secondary" id="detailDeskripsi"></p>
              <hr />
              <h5 class="fw-bold">Tujuan Kegiatan</h5>
              <p class="text-secondary" id="detailTujuan"></p>
              <hr />
              <h5 class="fw-bold">Sasaran Peserta</h5>
              <p class="text-secondary" id="detailTarget"></p>
              <hr />
              <h5 class="fw-bold">Agenda Kegiatan</h5>
              <ul class="list-group list-group-flush" id="detailAgenda"></ul>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <h4 class="fw-bold text-dark mb-4">Informasi Kegiatan</h4>
              <div class="d-flex align-items-center gap-3 mb-4">
                <i class="bi bi-calendar-event text-danger fs-3"></i>
                <div>
                  <div class="fw-bold text-dark">Tanggal</div>
                  <div class="text-secondary small" id="detailTanggal"></div>
                </div>
              </div>
              <div class="d-flex align-items-center gap-3 mb-4">
                <i class="bi bi-clock text-danger fs-3"></i>
                <div>
                  <div class="fw-bold text-dark">Waktu</div>
                  <div class="text-secondary small" id="detailWaktu"></div>
                </div>
              </div>
              <div class="d-flex align-items-center gap-3 mb-4">
                <i class="bi bi-geo-alt text-danger fs-3"></i>
                <div>
                  <div class="fw-bold text-dark">Lokasi</div>
                  <div class="text-secondary small" id="detailLokasi"></div>
                </div>
              </div>

              <div class="d-flex align-items-center gap-3 mb-4">
                <i class="bi bi-people text-danger fs-3"></i>
                <div>
                  <div class="fw-bold text-dark">Penyelenggara</div>
                  <div class="text-secondary small" id="detailPenyelenggara"></div>
                </div>
              </div>

              <hr class="text-muted opacity-25 my-4" />
              <button type="button" class="btn btn-danger w-100 mb-2 fw-bold" data-bs-toggle="modal" data-bs-target="#modalDaftar">
                <i class="bi bi-check-circle"></i> Daftar Event Sekarang
              </button>

              <a href="gis.html" id="tombolLokasi" class="btn btn-outline-danger w-100 mb-2">
                <i class="bi bi-geo-alt"></i> Lihat Lokasi Event
              </a>
              <button type="button" class="btn btn-secondary w-100" onclick="kembaliKeDaftar()">
                <i class="bi bi-arrow-left"></i> Kembali ke Daftar Event
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- MODAL PENDAFTARAN -->
    <div class="modal fade" id="modalDaftar" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Pendaftaran Event</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
      <div class="modal-body p-4">
          <form id="formDaftar" onsubmit="kirimPendaftaran(event)">
            <input type="text" class="form-control mb-3" id="inputNama" placeholder="Nama lengkap" required />
            <input type="text" class="form-control mb-3" placeholder="NIM" required />
            <input type="email" class="form-control mb-3" placeholder="Email aktif" required />
            <button type="submit" class="btn btn-danger w-100 fw-bold">Kirim Pendaftaran</button>
          </form>
          
        </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
  <script>
    function formatTanggal(mulai, selesai) {
      if (mulai.length === 7) {
        return new Date(mulai + "-01T00:00:00").toLocaleDateString("id-ID", { month: "long", year: "numeric" });
      }
      const opsi = { day: "numeric", month: "long", year: "numeric" };
      let hasil = new Date(mulai + "T00:00:00").toLocaleDateString("id-ID", opsi);
      if (selesai) {
        hasil += " sampai " + new Date(selesai + "T00:00:00").toLocaleDateString("id-ID", opsi);
      }
      return hasil;
    }

    function tampilkanDetail(e) {
      document.getElementById("detailKategori").textContent = e.category;
      document.getElementById("detailNama").textContent = e.title;
      document.getElementById("detailDeskripsi").textContent = e.description;
      document.getElementById("detailTujuan").textContent = e.purpose || "Belum diumumkan";
      document.getElementById("detailTarget").textContent = e.target;
      document.getElementById("detailTanggal").textContent = formatTanggal(e.date, e.dateEnd);
      document.getElementById("detailWaktu").textContent = e.time || "Belum diumumkan";
      document.getElementById("detailLokasi").textContent = e.location;
      document.getElementById("detailPenyelenggara").textContent = e.organizer;

      const agenda = e.agenda || ["Informasi susunan acara belum diumumkan."];
      document.getElementById("detailAgenda").innerHTML = agenda
        .map((item) => `<li class="list-group-item">${item}</li>`)
        .join("");
      document.getElementById("tombolLokasi").href = "gis.html?event=" + e.id;
      document.documentTitle = e.title + " | Event Mahasiswa Center";
    }

    function kirimPendaftaran(event) {
      event.preventDefault();
      const nama = document.getElementById("inputNama").value;
      const modalElem = document.getElementById("modalDaftar");
      const modal = bootstrap.Modal.getInstance(modalElem) || new bootstrap.Modal(modalElem);
      modal.hide();
      alert("Pendaftaran berhasil! Terima kasih " + nama);
      document.getElementById("formDaftar").reset();
    }
    function kembaliKeDaftar() {
      window.location.href = "event.html";
    }
    const idDariUrl = new URLSearchParams(window.location.search).get("event");
    const eventDipilih = DATA_EVENT.find((e) => e.id === idDariUrl) || DATA_EVENT[0];
    tampilkanDetail(eventDipilih);
  </script>
  </body>
</html>
