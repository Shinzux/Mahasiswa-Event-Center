<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Peta Event | Event Mahasiswa Center</title>

  <!-- Bootstrap Online -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Style CSS-->
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- Leaflet lokal -->
  <link rel="stylesheet" href="assets/leaflet/css/leaflet.css" />

  <style>
    body {
      background-color: #fff5f6;
    }
  </style>
</head>

<body>
  <!-- Wadah Navbar (dimuat dinamis dari template/navbar.html) -->
  <div id="navbar-placeholder"></div>

  <!-- JUDUL HALAMAN -->
  <div class="container mt-4">
    <h1 class="judul-halaman">Peta Lokasi Event</h1>

    <p class="text-secondary">Temukan lokasi berbagai acara mahasiswa melalui peta interaktif.</p>

    <!-- PETA -->
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body">
        <h5 class="mb-3">Lokasi Seluruh Event</h5>

        <div id="map"></div>
      </div>
    </div>
  </div>

  <!-- Wadah Footer (dimuat dinamis dari template/footer.html) -->
  <div id="footer-placeholder"></div>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>

  <!-- Leaflet JavaScript -->
  <script src="assets/leaflet/js/leaflet.js"></script>

  <!-- JAVASCRIPT PETA -->
  <script>
    // 1. Membuat peta dan menentukan titik tengah
    var map = L.map("map").setView([-6.9147, 107.6098], 13);

    // 2. Menampilkan tampilan peta dari OpenStreetMap
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    // 3. Menyiapkan data event
    // Koordinat berikut hanya contoh, bukan lokasi event sebenarnya.

    var events = [
      {
        nama: "Seminar Teknologi",
        tanggal: "15 November 2026",
        lokasi: "Lokasi Contoh A",
        latitude: -6.9175,
        longitude: 107.6191,
      },

      {
        nama: "Workshop UI/UX",
        tanggal: "20 November 2026",
        lokasi: "Lokasi Contoh B",
        latitude: -6.9025,
        longitude: 107.6188,
      },

      {
        nama: "Festival Mahasiswa",
        tanggal: "25 November 2026",
        lokasi: "Lokasi Contoh C",
        latitude: -6.927,
        longitude: 107.603,
      },
    ];

    // 4. Membuat marker untuk setiap event
    //icon
    var defaultIcon = L.icon({
      iconUrl: "assets/leaflet/images/marker-icon.png",
      iconRetinaUrl: "assets/leaflet/images/marker-icon-2x.png",
      shadowUrl: "assets/leaflet/images/marker-shadow.png",
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41],
    });

    events.forEach(function (event) {
      var marker = L.marker([event.latitude, event.longitude], {
        icon: defaultIcon,
      }).addTo(map);

      // 5. Menampilkan informasi ketika marker diklik
      marker.bindPopup(
        "<b>" + event.nama + "</b><br>" + "Tanggal: " + event.tanggal + "<br>" + "Lokasi: " + event.lokasi,
      );
    });
  </script>
</body>

</html>
