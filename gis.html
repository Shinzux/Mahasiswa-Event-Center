<!doctype html>
<!-- Halaman Peta Seluruh Event | PIC: Faruq -->
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Event | Event Mahasiswa Center</title>

  <!-- Framework Bootstrap (CSS & Ikon) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Style CSS Eksternal -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Leaflet CSS (Wajib untuk tampilan peta) -->
  <link rel="stylesheet" href="assets/leaflet/css/leaflet.css">

  <!-- CSS Tambahan Sederhana -->
  <style>
    body {
      background-color: #fff5f6;
    }
  </style>
</head>

<body>

  <!-- ==========================================
       NAVBAR (Dimuat otomatis oleh script.js)
       ========================================== -->
  <div id="navbar-placeholder"></div>

  <!-- ==========================================
       KONTEN UTAMA: HEADER & PETA
       ========================================== -->
  <main class="container mt-4">

    <!-- Header Halaman -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div>
        <h1 class="judul-halaman mb-1">Peta Lokasi Event</h1>
        <p class="text-secondary mb-0">Temukan lokasi berbagai acara mahasiswa melalui peta interaktif.</p>
      </div>
      <div class="d-flex gap-2">
        <a href="beranda.html" class="btn btn-secondary">
          <i class="bi bi-house"></i> Kembali ke Beranda
        </a>
      </div>
    </div>

    <!-- Kotak / Card Wadah Peta -->
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body">
        <h5 class="mb-3">Lokasi Seluruh Event</h5>

        <!-- Elemen tempat Leaflet menampilkan peta -->
        <div id="map"></div>
      </div>
    </div>

  </main>

  <!-- ==========================================
       FOOTER (Dimuat otomatis oleh script.js)
       ========================================== -->
  <div id="footer-placeholder"></div>

  <!-- ==========================================
       SKRIP PENDUKUNG (Bootstrap, Data Event, Leaflet)
       ========================================== -->
  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script Proyek (Memuat Navbar, Footer, dan DATA_EVENT) -->
  <script src="assets/js/script.js"></script>

  <!-- Library Leaflet JS -->
  <script src="assets/leaflet/js/leaflet.js"></script>

  <!-- ==========================================
       JAVASCRIPT PETA GIS
       ========================================== -->
  <script>
    // ==========================================
    // 1. PENGATURAN PETA (KOORDINAT & ZOOM)
    // ==========================================
    // Titik pusat awal peta (default: Kota Bandung)
    // Ubah angka koordinat dan tingkat zoom di bawah ini jika diinstruksikan dosen
    var pusatLat = -6.9147;
    var pusatLng = 107.6098;
    var tingkatZoom = 13;

    // Membuat objek peta Leaflet dan menentukan posisi awal
    var map = L.map("map").setView([pusatLat, pusatLng], tingkatZoom);

    // Menampilkan gambar tile peta dari OpenStreetMap
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // ==========================================
    // 2. DATA EVENT & IKON MARKER
    // ==========================================
    // Menyiapkan gambar ikon marker Leaflet
    var ikonMarker = L.icon({
      iconUrl: "assets/leaflet/images/marker-icon.png",
      iconRetinaUrl: "assets/leaflet/images/marker-icon-2x.png",
      shadowUrl: "assets/leaflet/images/marker-shadow.png",
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // ==========================================
    // 3. MENAMPILKAN MARKER
    // ==========================================
    // Menampilkan marker untuk setiap event dari array DATA_EVENT
    for (var i = 0; i < DATA_EVENT.length; i++) {
      var eventItem = DATA_EVENT[i];

      // Hanya tampilkan jika event memiliki data latitude dan longitude
      if (eventItem.latitude && eventItem.longitude) {
        var marker = L.marker([eventItem.latitude, eventItem.longitude], {
          icon: ikonMarker
        }).addTo(map);

        // ==========================================
        // 4. INFORMASI POPUP
        // ==========================================
        // Menyusun teks informasi yang tampil saat marker diklik
        var isiPopup = "";
        isiPopup += "<b>" + eventItem.title + "</b><br>";
        isiPopup += "Penyelenggara: " + eventItem.organizer + "<br>";
        isiPopup += "Tanggal: " + eventItem.date + "<br>";
        isiPopup += "Lokasi: " + eventItem.location + "<br>";
        isiPopup += '<a href="detail-event.html?event=' + eventItem.id + '" class="btn btn-maroon btn-sm mt-2 rounded-pill px-3 text-white fw-semibold" style="text-decoration:none;">';
        isiPopup += '<i class="bi bi-info-circle me-1"></i> Lihat Detail Event</a>';

        // Menghubungkan popup ke marker
        marker.bindPopup(isiPopup);
      }
    }

    // ==========================================
    // 5. INTERAKSI PENGGUNA
    // ==========================================
    // Contoh jika dosen meminta menambah marker baru langsung di file ini:
    // var markerBaru = L.marker([-6.9261, 107.6260], { icon: ikonMarker }).addTo(map);
    // markerBaru.bindPopup("<b>Lokasi Tambahan</b><br>Kampus UKRI Bandung");
  </script>

</body>

</html>
