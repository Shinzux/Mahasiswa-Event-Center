<!doctype html>
<!-- Halaman Peta Lokasi Satu Event | PIC: Faruq -->
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Event | Event Mahasiswa Center</title>

  <!-- Framework Bootstrap (CSS & Ikon) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Style CSS Eksternal -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Leaflet CSS (Wajib untuk tampilan peta) -->
  <link rel="stylesheet" href="assets/leaflet/css/leaflet.css">

  <!-- CSS Tambahan Sederhana -->
  <style>
    body {
      background-color: #fff5f6;
    }
  </style>
</head>

<body>

  <!-- ==========================================
       NAVBAR (Dimuat otomatis oleh script.js)
       ========================================== -->
  <div id="navbar-placeholder"></div>

  <!-- ==========================================
       KONTEN UTAMA: HEADER & PETA
       ========================================== -->
  <main class="container mt-4">

    <!-- Header Halaman (Teks Judul dan Deskripsi Berubah Sesuai Event) -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div>
        <h1 class="judul-halaman mb-1" id="judulEvent">Peta Lokasi Event</h1>
        <p class="text-secondary mb-0" id="deskripsiEvent">Lokasi kegiatan event.</p>
      </div>
      <div class="d-flex gap-2">
        <a id="btnKembaliDetail" href="detail-event.html" class="btn btn-outline-danger">
          <i class="bi bi-arrow-left"></i> Kembali ke Detail Event
        </a>
        <a href="event.html" class="btn btn-secondary">
          <i class="bi bi-grid"></i> Daftar Event
        </a>
      </div>
    </div>

    <!-- Kotak / Card Wadah Peta -->
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body">
        <!-- Elemen tempat Leaflet menampilkan peta -->
        <div id="map"></div>
      </div>
    </div>

  </main>

  <!-- ==========================================
       FOOTER (Dimuat otomatis oleh script.js)
       ========================================== -->
  <div id="footer-placeholder"></div>

  <!-- ==========================================
       SKRIP PENDUKUNG (Bootstrap, Data Event, Leaflet)
       ========================================== -->
  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script Proyek (Memuat Navbar, Footer, dan DATA_EVENT) -->
  <script src="assets/js/script.js"></script>

  <!-- Library Leaflet JS -->
  <script src="assets/leaflet/js/leaflet.js"></script>

  <!-- ==========================================
       JAVASCRIPT PETA DETAIL SATU EVENT
       ========================================== -->
  <script>
    // ==========================================
    // 1. DATA EVENT & PEMILIHAN DARI URL
    // ==========================================
    // Mengambil parameter ?event=ID dari URL browser (contoh: gis-event.html?event=EVT-01)
    var parameterUrl = new URLSearchParams(window.location.search);
    var idEventDicari = parameterUrl.get("event") || parameterUrl.get("id");

    // Mencari data event yang sesuai dari array DATA_EVENT menggunakan perulangan for
    var eventTerpilih = null;
    if (idEventDicari) {
      for (var i = 0; i < DATA_EVENT.length; i++) {
        if (DATA_EVENT[i].id === idEventDicari) {
          eventTerpilih = DATA_EVENT[i];
          break;
        }
      }
    }

    // Jika tidak ditemukan atau tidak ada parameter di URL, gunakan event pertama sebagai default
    if (!eventTerpilih && DATA_EVENT.length > 0) {
      eventTerpilih = DATA_EVENT[0];
    }

    // ==========================================
    // 2. INTERAKSI PENGGUNA (UPDATE JUDUL & TOMBOL)
    // ==========================================
    // Memperbarui judul halaman, deskripsi, dan tautan tombol kembali
    if (eventTerpilih) {
      var elemenJudul = document.getElementById("judulEvent");
      var elemenDeskripsi = document.getElementById("deskripsiEvent");
      var tombolKembali = document.getElementById("btnKembaliDetail");

      if (elemenJudul) {
        elemenJudul.textContent = "Peta Lokasi - " + eventTerpilih.title;
      }
      if (elemenDeskripsi) {
        elemenDeskripsi.textContent = "Lokasi kegiatan " + eventTerpilih.title + " (" + eventTerpilih.organizer + ").";
      }
      if (tombolKembali) {
        tombolKembali.href = "detail-event.html?event=" + eventTerpilih.id;
      }
      document.title = "Peta Event - " + eventTerpilih.title + " | Event Mahasiswa Center";
    }

    // ==========================================
    // 3. PENGATURAN PETA (KOORDINAT & ZOOM)
    // ==========================================
    // Titik pusat default jika event tidak memiliki koordinat
    var pusatLat = -6.9147;
    var pusatLng = 107.6098;
    var tingkatZoom = 16; // Tingkat zoom lebih dekat untuk fokus ke satu lokasi

    // Jika event yang dipilih memiliki koordinat, fokuskan peta ke lokasi tersebut
    if (eventTerpilih && eventTerpilih.latitude && eventTerpilih.longitude) {
      pusatLat = eventTerpilih.latitude;
      pusatLng = eventTerpilih.longitude;
    }

    // Membuat objek peta Leaflet
    var map = L.map("map").setView([pusatLat, pusatLng], tingkatZoom);

    // Menampilkan gambar tile peta OpenStreetMap
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // ==========================================
    // 4. DATA IKON & MENAMPILKAN MARKER
    // ==========================================
    // Menyiapkan gambar ikon marker Leaflet
    var ikonMarker = L.icon({
      iconUrl: "assets/leaflet/images/marker-icon.png",
      iconRetinaUrl: "assets/leaflet/images/marker-icon-2x.png",
      shadowUrl: "assets/leaflet/images/marker-shadow.png",
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // Menampilkan seluruh marker event dan langsung membuka popup event yang sedang dilihat
    for (var j = 0; j < DATA_EVENT.length; j++) {
      var itemEvent = DATA_EVENT[j];

      if (itemEvent.latitude && itemEvent.longitude) {
        var marker = L.marker([itemEvent.latitude, itemEvent.longitude], {
          icon: ikonMarker
        }).addTo(map);

        // ==========================================
        // 5. INFORMASI POPUP
        // ==========================================
        // Menyusun isi teks popup informasi
        var isiPopup = "";
        isiPopup += "<b>" + itemEvent.title + "</b><br>";
        isiPopup += "Penyelenggara: " + itemEvent.organizer + "<br>";
        isiPopup += "Tanggal: " + itemEvent.date + "<br>";
        isiPopup += "Lokasi: " + itemEvent.location;

        var popup = marker.bindPopup(isiPopup);

        // Buka popup otomatis hanya untuk event yang sedang dipilih
        if (eventTerpilih && itemEvent.id === eventTerpilih.id) {
          popup.openPopup();
        }
      }
    }
  </script>

</body>

</html>
